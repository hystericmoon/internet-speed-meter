name: Build debug APK

on:
  push:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Re-record screenshot baselines (after an intended UI change) and commit them"
        type: boolean
        default: false

permissions:
  contents: write # publish the "debug-latest" release; commit re-recorded screenshots

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Re-record screenshots
        if: inputs.record_screenshots
        run: |
          ./gradlew recordRoborazziDebug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          git diff --cached --quiet || git commit -m "Re-record screenshot baselines"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Unit tests + screenshot comparison, lint, then the APK. versionCode comes from
      # GITHUB_RUN_NUMBER (see app/build.gradle.kts), so every build is newer than the last.
      - name: Test, lint and build
        run: ./gradlew verifyRoborazziDebug lintDebug assembleDebug --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed-meter-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Only the default branch feeds the release, i.e. the phone's auto-updater.
      # Other branches still get the APK as an artifact above.
      - name: Publish to "debug-latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk speed-meter-debug.apk
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/debug-latest"
          jq -n \
            --argjson versionCode "$GITHUB_RUN_NUMBER" \
            --arg versionName "0.1.$GITHUB_RUN_NUMBER" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg apkUrl "$base/speed-meter-debug.apk" \
            --arg sha256 "$(sha256sum speed-meter-debug.apk | cut -d' ' -f1)" \
            '$ARGS.named' > version.json
          cat version.json
          notes="Version 0.1.$GITHUB_RUN_NUMBER, built from \`$GITHUB_REF_NAME\` at ${GITHUB_SHA::7}. Download speed-meter-debug.apk below and open it to install."

          if gh release view debug-latest > /dev/null 2>&1; then
            # Update in place so the download URLs never 404 mid-publish.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/debug-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release upload debug-latest speed-meter-debug.apk --clobber
            # Manifest last, so it never points at an APK that isn't there yet.
            gh release upload debug-latest version.json --clobber
            gh release edit debug-latest --notes "$notes"
          else
            gh release create debug-latest speed-meter-debug.apk version.json \
              --prerelease --target "$GITHUB_SHA" --title "Latest debug build" --notes "$notes"
          fi
